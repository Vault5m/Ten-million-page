<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 million Papers - $2 Each</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:0}
.top{background:#ffeb00;color:#000;padding:14px;font-weight:900;font-size:18px}
h2{font-size:26px;margin:15px 0}
.card{border:2px solid #ffeb00;border-radius:15px;margin:12px;padding:15px}
.addr{border:2px solid #ffeb00;border-radius:12px;padding:12px;color:#00ff88;font-weight:bold;word-break:break-all;margin:12px 0}
.btn{background:#ffeb00;color:#000;border:0;width:100%;padding:15px;border-radius:10px;font-weight:900;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
.box{border:2px solid #ffeb00;border-radius:15px;padding:22px 5px;font-weight:bold}
</style>
</head>
<body>
<div class="top">LOCKED - YOU MUST PAY $2 FIRST VIA TRUST WALLET</div>
<h2>10 million Papers - $2 Each</h2>
<div class="card">
Send $2 USDT BEP20 BSC via Trust Wallet to:
<div class="addr" id="w">0xf6C585Fe0Bc79c2D29f1FeC4D35A69CF09Ac5915</div>
<button class="btn" onclick="navigator.clipboard.writeText('0xf6C585Fe0Bc79c2D29f1FeC4D35A69CF09Ac5915');alert('Copied!')">COPY WALLET</button>
<div style="margin-top:10px;color:#aaa;font-size:12px">Network BSC BEP20 - Amount $2 USDT<br><span id="count"></span></div>
</div>
<div class="grid" id="grid"></div>
<script>
const MAX=10000000, BATCH=500;
let sold=parseInt(localStorage.getItem('s')||'0');
let available=parseInt(localStorage.getItem('a')||'1000');
function save(){localStorage.setItem('s',sold);localStorage.setItem('a',available)}
function check(){if(available<=500 && sold+available<MAX){available+=BATCH;if(sold+available>MAX)available=MAX-sold;save()}}
function render(){
document.getElementById('count').innerText=`Available: ${available} / ${MAX} | Sold: ${sold}`;
let g=document.getElementById('grid');g.innerHTML='';
for(let i=1;i<=available;i++){let d=document.createElement('div');d.className='box';d.innerHTML=`LOCKED<br>#${sold+i}`;d.onclick=()=>{sold++;available--;save();check();render()};g.appendChild(d)}
}
render();
</script>
</body>
</html>
